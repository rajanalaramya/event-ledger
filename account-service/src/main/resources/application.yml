server:
  port: 8081
  max-http-request-header-size: 16KB
  shutdown: graceful
spring:
  application:
    name: account-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:h2:file:./data/account-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  h2.console.enabled: false
  jackson:
    deserialization.fail-on-unknown-properties: true
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,prometheus,info,metrics
  endpoint:
    health:
      probes.enabled: true
      show-details: always
    shutdown.enabled: false
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
  tracing.sampling.probability: 1.0
  metrics.tags.application: ${spring.application.name}
logging.pattern.level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
info.app:
  name: account-service
  version: 1.0.0-SNAPSHOT
