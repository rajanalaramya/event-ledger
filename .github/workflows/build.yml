name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode clean verify
      # Dependency tree aids review; use a dedicated vulnerability scanner in deployment pipelines.
      - name: Inspect dependency graph
        run: mvn --batch-mode dependency:tree
